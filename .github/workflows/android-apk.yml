name: Build Chronos Android APK
# Firebase repository variables are injected at build time; rerun this workflow after changing them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'firestore.rules'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch bundled Gising Na logo
        run: |
          mkdir -p public/resources
          curl --fail --location --retry 3 'https://chronos-alarm-schedule-manager-ampjst.v2.appdeploy.ai/resources/gising-na-logo.jpg' --output public/resources/gising-na-logo.jpg
          test -s public/resources/gising-na-logo.jpg
          file public/resources/gising-na-logo.jpg
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - name: Generate Android project
        run: npx cap add android
      - name: Enable exact Android alarms
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$manifest"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' "$manifest"
          fi
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$manifest"
      - name: Prepare circular launcher icon from Gising Na logo
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
          mkdir -p assets
          # Crop the logo to a circle and keep the rest of the icon transparent.
          convert public/resources/gising-na-logo.jpg -auto-orient -thumbnail '700x700^' -gravity center -extent 700x700 /tmp/gising-na-square.png
          convert -size 700x700 xc:black -fill white -draw 'circle 350,350 350,2' /tmp/gising-na-circle-mask.png
          convert /tmp/gising-na-square.png /tmp/gising-na-circle-mask.png -alpha off -compose CopyOpacity -composite /tmp/gising-na-circle.png
          # Draw a circular teal badge with a cyan outline, then place the circular logo inside it.
          convert -size 1024x1024 xc:none -fill '#08202b' -stroke '#00f2fe' -strokewidth 12 \
            -draw 'circle 512,512 512,54' /tmp/gising-na-base.png
          convert /tmp/gising-na-base.png /tmp/gising-na-circle.png -gravity center -compose over -composite assets/icon.png
          cp assets/icon.png assets/icon-foreground.png
          convert -size 1024x1024 xc:'#070a12' assets/icon-background.png
          npx --yes @capacitor/assets generate --android --assetPath assets
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronos-alarm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
